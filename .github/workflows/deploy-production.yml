name: PageMind Release & Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release-builds:
    name: 🚀 Build Production Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Production Backend JAR
        run: |
          cd backend-core
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Production Assets
        run: |
          cd web-frontend
          npm ci
          npm run build

      - name: Build Release APK (16 KB Aligned)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagemind-production-release-bundle
          path: |
            backend-core/target/*.jar
            web-frontend/dist/
            android-app/app/build/outputs/apk/debug/app-debug.apk
