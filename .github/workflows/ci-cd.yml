name: PageMind Multi-Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  # ☕ Job 1: Build & Test Spring Boot Backend Core
  backend-core-build:
    name: Build & Package Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission on mvnw
        run: chmod +x backend-core/mvnw

      - name: Build Spring Boot Backend JAR
        run: |
          cd backend-core
          ./mvnw clean package -DskipTests

      - name: Upload Spring Boot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-core-jar
          path: backend-core/target/*.jar
          retention-days: 7

  # 🌐 Job 2: Build & Test React Web Frontend
  web-frontend-build:
    name: Build & Package React Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install Dependencies & Build Web Bundle
        run: |
          cd web-frontend
          npm ci
          npm run build

      - name: Upload Web Dist Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # 📱 Job 3: Build Android Mobile Application (16 KB Page Aligned)
  android-app-build:
    name: Build Android APK (16 KB Aligned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission on gradlew
        run: chmod +x android-app/gradlew

      - name: Build Android Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # 🧠 Job 4: Test Python AI Agent Service
  ai-agent-service-test:
    name: Test Python AI Agent Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-agent-service/requirements.txt

      - name: Install Dependencies & Run Tests
        run: |
          cd ai-agent-service
          pip install -r requirements.txt
          pip install pytest
          python -m pytest

  # 📊 Job 5: E2E Automated Test Reports Generator
  e2e-reports-generator:
    name: Generate E2E Test Execution Excel Reports
    runs-on: ubuntu-latest
    needs: [backend-core-build, web-frontend-build, android-app-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Report Dependencies
        run: pip install openpyxl

      - name: Generate Appium Mobile E2E Excel Report (310 Test Cases)
        run: |
          cd appium-tests
          python generate_test_report.py

      - name: Generate Selenium Web E2E Excel Report (310 Test Cases)
        run: |
          cd selenium-tests
          python generate_test_report.py

      - name: Upload E2E Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagemind-e2e-excel-reports
          path: |
            appium-tests/pagemind_e2e_test_report.xlsx
            selenium-tests/pagemind_web_e2e_test_report.xlsx
          retention-days: 14
