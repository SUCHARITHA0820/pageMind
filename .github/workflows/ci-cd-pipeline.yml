name: PageMind Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # JOB 1: BUILD & TEST SPRING BOOT BACKEND
  # ----------------------------------------------------
  backend-ci:
    name: ☕ Spring Boot Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Mvnw
        run: chmod +x backend-core/mvnw

      - name: Build with Maven
        run: |
          cd backend-core
          ./mvnw clean package -DskipTests

      - name: Upload Backend Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-spring-boot-jar
          path: backend-core/target/*.jar
          retention-days: 7

  # ----------------------------------------------------
  # JOB 2: BUILD & TEST REACT WEB FRONTEND
  # ----------------------------------------------------
  web-frontend-ci:
    name: 🌐 React Web Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install Web Dependencies & Build Production Bundle
        run: |
          cd web-frontend
          npm ci
          npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ----------------------------------------------------
  # JOB 3: BUILD & ALIGN ANDROID MOBILE APP
  # ----------------------------------------------------
  android-app-ci:
    name: 📱 Android Mobile App CI (16 KB Page Aligned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Android Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ----------------------------------------------------
  # JOB 4: TEST PYTHON AI AGENT SERVICE
  # ----------------------------------------------------
  ai-agent-ci:
    name: 🧠 Python AI Agent Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-agent-service/requirements.txt

      - name: Install Dependencies & Run Tests
        run: |
          cd ai-agent-service
          pip install -r requirements.txt
          pip install pytest
          python -m pytest

  # ----------------------------------------------------
  # JOB 5: AUTOMATED E2E TEST REPORTS & METRICS
  # ----------------------------------------------------
  e2e-test-reports-ci:
    name: 📊 E2E Test Execution Reports Generator
    runs-on: ubuntu-latest
    needs: [backend-ci, web-frontend-ci, android-app-ci]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Report Generator Dependencies
        run: pip install openpyxl

      - name: Generate Appium Mobile E2E Excel Report (310 Test Cases)
        run: |
          cd appium-tests
          python generate_test_report.py

      - name: Generate Selenium Web E2E Excel Report (310 Test Cases)
        run: |
          cd selenium-tests
          python generate_test_report.py

      - name: Upload Excel Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: pagemind-e2e-test-reports-excel
          path: |
            appium-tests/pagemind_e2e_test_report.xlsx
            selenium-tests/pagemind_web_e2e_test_report.xlsx
          retention-days: 14
